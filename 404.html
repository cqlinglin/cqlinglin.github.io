<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面走丢了</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --accent: #a3e635;
      --accent-2: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(50% 40% at 78% 10%, rgba(163, 230, 53, 0.12), transparent 70%),
        #080c0a;
      color: #e9f1ec;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(100deg, #e2ff9d, #a3e635 40%, #34d399 70%, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #93a49b; margin: 18px 0 28px; }
    a {
      display: inline-block;
      padding: 11px 20px;
      border: 1px solid rgba(163, 230, 53, 0.42);
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(163, 230, 53, 0.22), rgba(52, 211, 153, 0.14));
      color: #e8ffc4;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -18px rgba(163, 230, 53, 0.9); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <p>这个页面好像掉进星海里了。</p>
    <a href="/">回到首页</a>
  </main>
</body>
</html>
